name: .

on:
  issues:
    types: [edited]

permissions:
  issues: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore content and lock original issue
        uses: actions/github-script@v7
        with:
          script: |
            const { issue, changes = {} } = context.payload;
            const hasContent = value => /[\p{L}\p{N}\p{Extended_Pictographic}]/u.test(value ?? '');
            const titleWasDeleted = changes.title && hasContent(changes.title.from) && !hasContent(issue.title);
            const bodyWasDeleted = changes.body && hasContent(changes.body.from) && !hasContent(issue.body);
            const previousTitle = changes.title ? changes.title.from : issue.title;
            const previousBody = changes.body ? changes.body.from : issue.body;
            if ((!titleWasDeleted && !bodyWasDeleted) || !hasContent(previousTitle) || !hasContent(previousBody)) return;

            const body = [
              previousBody,
              '',
              '---',
              '',
              `Restored from [#${issue.number}](${issue.html_url}).`,
            ].join('\n');

            await github.rest.issues.create({
              ...context.repo,
              title: previousTitle,
              body,
            });

            await github.rest.issues.lock({
              ...context.repo,
              issue_number: issue.number,
            });
