# Keep this workflow's file and name to retain the Android release run counter.
name: Android CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target (Linux includes Android, Desktop, Web, and F-Droid)
        type: choice
        default: all
        options:
          - all
          - linux
          - apple
          - android-desktop
          - ios
          - macos
          - windows
          - web
          - fdroid
  push:
    tags:
      - "**"
      - "!plugin-sdk-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true


jobs:
  lint:
    name: Kotlin lint
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - &clean-workspace
        uses: yumis-coconudge/clean-workspace-action@v1
      - &checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check CI contracts
        run: ruby .github/scripts/test_ci_workflow.rb
      - &setup-java
        name: Set up JDK
        uses: actions/setup-java@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: jetbrains
          java-version: 25
          cache: gradle
      - &setup-android
        name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Check Kotlin formatting
        run: ./gradlew :app:ktlintCheck :desktopApp:ktlintCheck --stacktrace

  build-linux:
    name: Linux (Android, Desktop)
    needs: lint
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux' || inputs.target == 'android-desktop'
    runs-on: [ubuntu-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job-linux
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 180
    env: &build-env
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_VERSION: ${{ github.ref_name }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - *clean-workspace
      - *checkout
      - *setup-java
      - *setup-android
      - name: Apply Signing
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: ./.github/apply_signing.sh
      - name: Run shared and desktop tests
        run: ./gradlew allTests :desktopApp:test -x wasmJsBrowserTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UI regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.dimension.flare.ui.screen.settings.ProxySettingsContentTest,dev.dimension.flare.ui.screen.settings.PluginManagementMenuTest,dev.dimension.flare.common.WebViewProxyTest,dev.dimension.flare.ui.screen.gallery.GalleryDetailScreenTest,dev.dimension.flare.ui.screen.media.ImageTranslationErrorDialogTest
            ./gradlew :compose-ui:connectedAndroidDeviceTest -Pandroid.testInstrumentationRunnerArguments.class=dev.dimension.flare.ui.component.SurfaceBindingManagerTest
      - name: Build and package Android and Linux
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:check :app:lint :desktopApp:check :desktopApp:build :desktopApp:packageReleaseAppImage -x ktlintCheck --stacktrace
      - name: Upload AppImage package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Linux-package
          path: |
            desktopApp/build/compose/binaries/main-release/AppImage/*.appimage
            desktopApp/build/compose/binaries/main-release/AppImage/*.AppImage
      - name: Prepare Android store bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "$RUNNER_TEMP/android-store"
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/android-store"
      - name: Upload Android store bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Android-store
          path: ${{ runner.temp }}/android-store
          if-no-files-found: error

  build-web:
    name: Web (Wasm, Svelte)
    needs: lint
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux' || inputs.target == 'web'
    runs-on: [ubuntu-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job-web
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 90
    env: *build-env
    steps:
      - *clean-workspace
      - *checkout
      - *setup-java
      - *setup-android
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Run Kotlin wasmJs tests
        run: ./gradlew :web-shared:wasmJsTest :shared:wasmJsBrowserTest --tests '*ProxyEngineCapabilitiesTest*' --stacktrace
      - name: Run Svelte codegen tests
        working-directory: web
        run: pnpm test:codegen
      - name: Check Svelte
        working-directory: web
        run: pnpm check
      - name: Build Svelte
        working-directory: web
        run: pnpm build

  build-fdroid:
    name: F-Droid
    needs: lint
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux' || inputs.target == 'fdroid'
    runs-on: [ubuntu-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job-fdroid
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 180
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - *clean-workspace
      - *checkout
      - name: Set up Temurin
        uses: actions/setup-java@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - *setup-android
      - name: F-Droid prebuild
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          sed -i -e '/poolborges/d' settings.gradle.kts
          sed -i -e '/START Non-FOSS component/,/END Non-FOSS component/d' app/build.gradle.kts
      - name: Build F-Droid variant
        run: env -u BUILD_NUMBER -u BUILD_VERSION -u SENTRY_DSN ./gradlew :app:assembleRelease :app:check :app:lint -x ktlintCheck --stacktrace

  build-ios:
    name: iOS (build, native and UI regressions)
    needs: lint
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'apple' || inputs.target == 'ios'
    runs-on: [xcode-27]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job-ios
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 180
    env: &apple-env
      # The hosted ARM runner has 7 GB RAM; keep native links sequential within each job.
      GRADLE_OPTS: >-
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.project.kotlin.native.parallelThreads=1
        -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - *clean-workspace
      - *checkout
      - *setup-java
      - &setup-xcode
        name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install iOS
        run: xcodebuild -downloadPlatform iOS
      - name: Run iOS Kotlin tests
        run: |
          ./gradlew iosSimulatorArm64Test --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8"
      - name: Upload Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-iosSimulatorArm64-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
      - &install-xcodegen
        name: Install XcodeGen
        run: brew install xcodegen
      - &firebase-config
        name: Add Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            mkdir -p appleApp/Firebase
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -D > appleApp/Firebase/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_B64 is not set; Firebase config will not be bundled."
          fi
      - &generate-xcode
        name: Generate Xcode project
        run: xcodegen generate --spec appleApp/project.yml
      - name: Prepare HTTPS login test simulator
        run: |
          simulator=$(xcrun simctl create FlareNativeTests com.apple.CoreSimulator.SimDeviceType.iPhone-17)
          echo "FLARE_TEST_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl keychain "$simulator" add-root-cert shared/src/jvmTest/resources/proxy/localhost-cert.pem
      - name: Build iOS app and regression targets once
        working-directory: ./appleApp
        run: |
          xcodebuild build-for-testing -project Flare.xcodeproj -scheme CI-iOS \
            -destination "platform=iOS Simulator,id=$FLARE_TEST_SIMULATOR" \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation -skipMacroValidation \
            GRADLE_JVM_ARGS="-Xmx4G -Dfile.encoding=UTF-8" CODE_SIGNING_ALLOWED=NO
      - name: Run native proxy and playback regressions
        working-directory: ./appleApp
        run: |
          xcodebuild test-without-building -project Flare.xcodeproj -scheme CI-iOS \
            -derivedDataPath build/DerivedData -destination "platform=iOS Simulator,id=$FLARE_TEST_SIMULATOR" \
            -only-testing:TimelineControllerTests/ProxyPlaybackLifecycleTests \
            -only-testing:TimelineControllerTests/ProxyImageLifecycleTests \
            -only-testing:TimelineControllerTests/WebViewProxyTests \
            -only-testing:TimelineControllerTests/LoginCookieSnapshotTests \
            -only-testing:TimelineControllerTests/UgoiraPlaybackTests \
            -only-testing:iOSTests/VideoPlaybackSessionTests \
            -only-testing:iOSTests/MediaPlaybackMemoryTests \
            -only-testing:iOSTests/TimelinePlaybackCoordinatorTests \
            -only-testing:iOSTests/MediaTransferCancellationTests \
            -parallel-testing-enabled NO -collect-test-diagnostics never
      - name: Run image translation error UI regressions
        working-directory: ./appleApp
        run: |
          python3 ../scripts/test_image_translation_server.py > "$RUNNER_TEMP/image-translation-fixture.log" 2>&1 &
          image_fixture_pid=$!
          trap 'kill "$image_fixture_pid" 2>/dev/null || true' EXIT
          curl --retry-connrefused --retry 10 --retry-delay 1 --max-time 5 --fail --silent --show-error http://127.0.0.1:18473/health
          xcodebuild test-without-building -project Flare.xcodeproj -scheme CI-iOS \
            -derivedDataPath build/DerivedData -destination "platform=iOS Simulator,id=$FLARE_TEST_SIMULATOR" \
            -only-testing:MediaViewerInteractionTests/MediaViewerInteractionTests/testTranslationErrorDetailsAreOnlyAccessibleFromFailureAlertWithPost \
            -only-testing:MediaViewerInteractionTests/MediaViewerInteractionTests/testTranslationErrorDetailsAreOnlyAccessibleFromFailureAlertWithoutPost \
            -parallel-testing-enabled NO -collect-test-diagnostics never
      - name: Remove test simulator
        if: always() && env.FLARE_TEST_SIMULATOR != ''
        run: xcrun simctl delete "$FLARE_TEST_SIMULATOR"

  build-macos:
    name: macOS (Release)
    needs: lint
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'apple' || inputs.target == 'macos'
    runs-on: [xcode-27]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job-macos
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 180
    env: *apple-env
    steps:
      - *clean-workspace
      - *checkout
      - *setup-java
      - *setup-xcode
      - name: Run macOS Kotlin tests
        run: |
          ./gradlew macosArm64Test --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8"
      - name: Upload Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-macosArm64-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
      - *install-xcodegen
      - *firebase-config
      - *generate-xcode
      - name: Compile native macOS Kotlin libraries
        run: |
          ./gradlew :apple-shared:compileKotlinMacosArm64 --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8"
      - name: Build native macOS Kotlin framework
        run: |
          sysctl hw.memsize vm.swapusage
          # Keep dependency compiler state out of the uncached Release linker process.
          ./gradlew :apple-shared:linkReleaseFrameworkMacosArm64 --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx5G -Dfile.encoding=UTF-8"
      - name: import certs
        if: startsWith(github.ref, 'refs/tags/')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Install macOS Provision Profile
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$MACOS_EMBEDDED_PROVISION" > "$RUNNER_TEMP/native-macos.provisionprofile.b64"
          base64 -d -i "$RUNNER_TEMP/native-macos.provisionprofile.b64" > "$RUNNER_TEMP/native-macos.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/native-macos.provisionprofile" > "$RUNNER_TEMP/native-macos-profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/native-macos-profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/native-macos-profile.plist")
          cp "$RUNNER_TEMP/native-macos.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.provisionprofile"
          echo "NATIVE_MACOS_PROVISIONING_PROFILE=$profile_uuid" >> "$GITHUB_ENV"
          echo "NATIVE_MACOS_PROVISIONING_PROFILE_SPECIFIER=$profile_name" >> "$GITHUB_ENV"
        env:
          MACOS_EMBEDDED_PROVISION: ${{ secrets.MACOS_EMBEDDED_PROVISION }}
      - name: Resolve native macOS signing identities
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          security find-identity -v -p codesigning
          security find-identity -v -p basic

          app_identity=$(security find-identity -v -p codesigning | sed -n 's/.*"\(3rd Party Mac Developer Application: .* (7LFDZ96332)\)".*/\1/p' | head -n 1)
          installer_identity=$(security find-identity -v -p basic | sed -n 's/.*"\(3rd Party Mac Developer Installer: .* (7LFDZ96332)\)".*/\1/p' | head -n 1)

          if [ -z "$app_identity" ]; then
            echo "No 3rd Party Mac Developer Application identity found for team 7LFDZ96332."
            exit 1
          fi

          if [ -z "$installer_identity" ]; then
            echo "No 3rd Party Mac Developer Installer identity found for team 7LFDZ96332."
            exit 1
          fi

          echo "NATIVE_MACOS_APP_SIGNING_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "NATIVE_MACOS_INSTALLER_SIGNING_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
      - name: Resolve native macOS version
        run: |
          marketing_version="$(sed -n 's/^versionName=//p' fdroid.properties | head -n 1)"

          if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            marketing_version="$GITHUB_REF_NAME"
          fi

          if [ -z "$marketing_version" ]; then
            echo "Unable to resolve native macOS marketing version"
            exit 1
          fi

          echo "NATIVE_MACOS_MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "NATIVE_MACOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build native macOS app
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        working-directory: ./appleApp
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          xcodebuild build \
            -project Flare.xcodeproj \
            -scheme macOS \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            GRADLE_JVM_ARGS="-Xmx5G -Dfile.encoding=UTF-8" \
            MARKETING_VERSION="$NATIVE_MACOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$NATIVE_MACOS_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive native macOS app
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./appleApp
        env:
          FIREBASE_CRASHLYTICS_UPLOAD_SYMBOLS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          xcodebuild archive \
            -project Flare.xcodeproj \
            -scheme macOS \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Flare-native-macOS.xcarchive" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM=7LFDZ96332 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$NATIVE_MACOS_APP_SIGNING_IDENTITY" \
            NATIVE_MACOS_PROVISIONING_PROFILE_SPECIFIER="$NATIVE_MACOS_PROVISIONING_PROFILE_SPECIFIER" \
            NATIVE_MACOS_PROVISIONING_PROFILE="$NATIVE_MACOS_PROVISIONING_PROFILE" \
            GRADLE_JVM_ARGS="-Xmx5G -Dfile.encoding=UTF-8" \
            MARKETING_VERSION="$NATIVE_MACOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$NATIVE_MACOS_BUILD_NUMBER"
      - name: Package native macOS app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/Flare-native-macOS.xcarchive/Products/Applications/Flare.app"
          if [ ! -d "$app_path" ]; then
            echo "No archived app found at $app_path"
            exit 1
          fi

          mkdir -p appleApp/build/native-macos/pkg
          safe_ref="${GITHUB_REF_NAME//\//-}"
          pkg_path="appleApp/build/native-macos/pkg/Flare-native-macOS-$safe_ref.pkg"
          productbuild --sign "$NATIVE_MACOS_INSTALLER_SIGNING_IDENTITY" --component "$app_path" /Applications "$pkg_path"
      - name: Upload native macOS package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Native-macOS-package
          path: appleApp/build/native-macos/pkg/*.pkg

  build-windows:
    name: Windows
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    needs: lint
    runs-on: [windows-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job-windows
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 30
    env: *build-env
    steps:
      - *clean-workspace
      - *checkout
      - *setup-java
      - name: Run Tests
        run: ./gradlew jvmTest :desktopApp:test
      - name: Build and package Windows
        run: ./gradlew :desktopApp:check :desktopApp:build :desktopApp:packageReleaseAppx -x ktlintCheck --stacktrace
      - name: Build appxbundle with same version as appx
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appx = Get-ChildItem "desktopApp/build/compose/binaries/main-release/appx/*.appx" | Select-Object -First 1
          if (-not $appx) {
            throw "No .appx file found"
          }

          $bundlePath = [System.IO.Path]::ChangeExtension($appx.FullName, ".appxbundle")
          $tempDir = Join-Path $env:RUNNER_TEMP "appx-bundle-work"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          try {
            $manifestEntry = $zip.Entries | Where-Object { $_.FullName -ieq "AppxManifest.xml" } | Select-Object -First 1
            if (-not $manifestEntry) {
              throw "AppxManifest.xml not found in $($appx.Name)"
            }

            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try {
              [xml]$xml = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
          } finally {
            $zip.Dispose()
          }

          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("appx", $xml.DocumentElement.NamespaceURI)
          $versionNode = $xml.SelectSingleNode("/appx:Package/appx:Identity/@Version", $ns)
          if (-not $versionNode) {
            throw "Cannot read Identity Version from AppxManifest.xml"
          }
          $appxVersion = $versionNode.Value

          Write-Host "APPX:    $($appx.FullName)"
          Write-Host "Version: $appxVersion"
          Write-Host "Bundle:  $bundlePath"

          $mapping = Join-Path $tempDir "bundle.map.txt"
          @"
          [Files]
          "$($appx.FullName)" "$($appx.Name)"
          "@ | Set-Content -Path $mapping -Encoding ASCII

          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) {
            $alt = "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe"
            if (Test-Path $alt) {
              $makeAppx = Get-Item $alt
            }
          }
          if (-not $makeAppx) {
            throw "makeappx.exe not found. Please install Windows SDK on the runner."
          }

          & $makeAppx.FullName bundle /o /bv $appxVersion /f $mapping /p $bundlePath
      - name: Upload AppxBundle package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Windows-package
          path: desktopApp/build/compose/binaries/main-release/appx/*.appxbundle


  upload:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [ubuntu-latest]
    needs: [lint, build-ios, build-macos, build-windows, build-linux, build-web, build-fdroid]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-package"
      - uses: actions/download-artifact@v8
        with:
          name: Android-store
          path: android-store
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: dev.dimension.flare
          releaseFiles: android-store/app-release.aab
          track: internal
          mappingFile: android-store/mapping.txt
      - name: Draft a new release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            **/*.appxbundle
            **/*.pkg
            **/*.AppImage
            **/*.appimage
