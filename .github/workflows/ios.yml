name: iOS CI

on:
  push:
    branches:
      - master
      - release
      - develop
    tags:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
      - release
      - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: [xcode-27]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: 'jetbrains'
          java-version: 25
      # Run tests
      - name: Run Tests
        timeout-minutes: 120
        run: ./gradlew allTests -x wasmJsBrowserTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Install iOS
        run: xcodebuild -downloadPlatform iOS
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Add Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]; then
            mkdir -p appleApp/Firebase
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -D > appleApp/Firebase/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_B64 is not set; Firebase config will not be bundled."
          fi
      - name: Generate Xcode project
        run: xcodegen generate --spec appleApp/project.yml
      - name: Prepare HTTPS login test simulator
        run: |
          simulator=$(xcrun simctl create FlareNativeTests com.apple.CoreSimulator.SimDeviceType.iPhone-17)
          echo "FLARE_TEST_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl keychain "$simulator" add-root-cert shared/src/jvmTest/resources/proxy/localhost-cert.pem
      - name: Build
        working-directory: ./appleApp
        env:
          scheme: iOS
          platform: ${{ 'iOS Simulator' }}
        run: |
          # xcrun xctrace returns via stderr, not the expected stdout (see https://developer.apple.com/forums/thread/663959)
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,id=$FLARE_TEST_SIMULATOR" -skipPackagePluginValidation -skipMacroValidation \
            GRADLE_JVM_ARGS="-Xmx16G -Dfile.encoding=UTF-8"
      - name: Run native proxy and playback regressions
        working-directory: ./appleApp
        run: |
          xcodebuild test -project Flare.xcodeproj -scheme TimelineControllerTests \
            -destination "platform=iOS Simulator,id=$FLARE_TEST_SIMULATOR" \
            -only-testing:TimelineControllerTests/ProxyPlaybackLifecycleTests \
            -only-testing:TimelineControllerTests/ProxyImageLifecycleTests \
            -only-testing:TimelineControllerTests/WebViewProxyTests \
            -only-testing:TimelineControllerTests/LoginCookieSnapshotTests \
            -only-testing:TimelineControllerTests/UgoiraPlaybackTests \
            -parallel-testing-enabled NO -collect-test-diagnostics never -skipPackagePluginValidation -skipMacroValidation \
            GRADLE_JVM_ARGS="-Xmx16G -Dfile.encoding=UTF-8" CODE_SIGNING_ALLOWED=NO
          xcodebuild test-without-building -project Flare.xcodeproj -scheme iOS \
            -destination "platform=iOS Simulator,id=$FLARE_TEST_SIMULATOR" \
            -only-testing:iOSTests/VideoPlaybackSessionTests \
            -only-testing:iOSTests/MediaPlaybackMemoryTests \
            -only-testing:iOSTests/TimelinePlaybackCoordinatorTests \
            -only-testing:iOSTests/MediaTransferCancellationTests \
            -parallel-testing-enabled NO -collect-test-diagnostics never
      - name: Remove test simulator
        if: always() && env.FLARE_TEST_SIMULATOR != ''
        run: xcrun simctl delete "$FLARE_TEST_SIMULATOR"
