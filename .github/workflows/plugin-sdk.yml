name: Plugin SDK

on:
  push:
    tags:
      - "plugin-sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: feature/plugin/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-sdk-v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: feature/plugin/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check release version and channel
        id: release
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(process.env.GITHUB_REF_NAME, `plugin-sdk-v${version}`, "SDK tag must match package.json");
          const channel = version.split("+")[0].includes("-") ? "next" : "latest";
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${channel}\n`);
          NODE
      - name: Publish to npm with OIDC
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --tag "$NPM_DIST_TAG"
