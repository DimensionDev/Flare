name: FlareUIApple

options:
  minimumXcodeGenVersion: 2.45.4
  developmentLanguage: en
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_VERSION: "6.0"

targetTemplates:
  FlareUIAppleRenderer:
    type: framework.static
    settings:
      base:
        DEFINES_MODULE: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../demo/apple-framework/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

targets:
  FlareUISwiftUI:
    templates: [FlareUIAppleRenderer]
    platform: [iOS, macOS]
    sources:
      - path: Sources/SwiftUI
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.flareui.swiftui
        PRODUCT_MODULE_NAME: FlareUISwiftUI
        PRODUCT_NAME: FlareUISwiftUI

  FlareUIUIKit:
    templates: [FlareUIAppleRenderer]
    platform: iOS
    sources:
      - path: Sources/UIKit
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.flareui.uikit
        PRODUCT_MODULE_NAME: FlareUIUIKit
        PRODUCT_NAME: FlareUIUIKit

  FlareUIAppKit:
    templates: [FlareUIAppleRenderer]
    platform: macOS
    sources:
      - path: Sources/AppKit
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.flareui.appkit
        PRODUCT_MODULE_NAME: FlareUIAppKit
        PRODUCT_NAME: FlareUIAppKit

schemes:
  FlareUISwiftUI-iOS:
    build:
      targets:
        FlareUISwiftUI_iOS: all
      preActions:
        - name: Generate Flare UI code and compile Kotlin framework
          settingsTarget: FlareUISwiftUI_iOS
          script: &flareUiBuildScript |
            cd "$SRCROOT/../.."
            export ARCHS=arm64
            if [ -n "${GRADLE_JVM_ARGS:-}" ]; then
              ./gradlew "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" :flareUI:demo:apple-framework:embedAndSignAppleFrameworkForXcode
            else
              ./gradlew :flareUI:demo:apple-framework:embedAndSignAppleFrameworkForXcode
            fi

  FlareUISwiftUI-macOS:
    build:
      targets:
        FlareUISwiftUI_macOS: all
      preActions:
        - name: Generate Flare UI code and compile Kotlin framework
          settingsTarget: FlareUISwiftUI_macOS
          script: *flareUiBuildScript

  FlareUIUIKit-iOS:
    build:
      targets:
        FlareUIUIKit: all
      preActions:
        - name: Generate Flare UI code and compile Kotlin framework
          settingsTarget: FlareUIUIKit
          script: *flareUiBuildScript

  FlareUIAppKit-macOS:
    build:
      targets:
        FlareUIAppKit: all
      preActions:
        - name: Generate Flare UI code and compile Kotlin framework
          settingsTarget: FlareUIAppKit
          script: *flareUiBuildScript
