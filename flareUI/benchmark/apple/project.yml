name: FlareUIAppleBenchmark

options:
  minimumXcodeGenVersion: 2.45.4
  developmentLanguage: en
  defaultConfig: Release
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_VERSION: "6.0"

packages:
  FlareUIApple:
    path: ../..

targets:
  BenchmarkHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flare UI Benchmark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.ui.benchmark.host
        PRODUCT_NAME: Flare UI Benchmark
        TARGETED_DEVICE_FAMILY: "1,2"

  BenchmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BenchmarkHost
      - package: FlareUIApple
        product: FlareUISwiftUI
      - package: FlareUIApple
        product: FlareUIFoundationSwiftUI
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../apple-shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -framework FlareUI"
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.ui.benchmark.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Flare UI Benchmark.app/Flare UI Benchmark"

schemes:
  FlareUIAppleBenchmark:
    build:
      preActions:
        - name: Compile Kotlin benchmark bridge
          settingsTarget: BenchmarkHost
          script: |
            cd "$SRCROOT/../../.."
            export ARCHS=arm64
            if [ -n "${GRADLE_JVM_ARGS:-}" ]; then
              ./gradlew -p flareUI "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" :benchmark:apple-shared:embedAndSignAppleFrameworkForXcode
            else
              ./gradlew -p flareUI :benchmark:apple-shared:embedAndSignAppleFrameworkForXcode
            fi
      targets:
        BenchmarkHost: all
        BenchmarkTests:
          - test
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: BenchmarkTests
          parallelizable: false
          randomExecutionOrder: false
