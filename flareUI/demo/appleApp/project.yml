name: FlareUIDemo

options:
  minimumXcodeGenVersion: 2.45.4
  developmentLanguage: en
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    SWIFT_VERSION: "6.0"

targets:
  iOSDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flare UI Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        OTHER_LDFLAGS: "$(inherited) -framework FlareUI"
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.flareui.demo.ios
        PRODUCT_NAME: Flare UI Demo
        TARGETED_DEVICE_FAMILY: "1,2"

  macOSDemo:
    type: application
    platform: macOS
    sources:
      - path: Sources/macOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flare UI Demo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        OTHER_LDFLAGS: "$(inherited) -framework FlareUI"
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.flareui.demo.macos
        PRODUCT_NAME: Flare UI Demo
        ARCHS: arm64

schemes:
  FlareUIDemo-iOS:
    build:
      preActions:
        - name: Compile Kotlin
          settingsTarget: iOSDemo
          script: |
            cd "$SRCROOT/../../.."
            export ARCHS=arm64
            if [ -n "${GRADLE_JVM_ARGS:-}" ]; then
              ./gradlew -p flareUI "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" :demo:shared:embedAndSignAppleFrameworkForXcode
            else
              ./gradlew -p flareUI :demo:shared:embedAndSignAppleFrameworkForXcode
            fi
      targets:
        iOSDemo: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FlareUIDemo-macOS:
    build:
      preActions:
        - name: Compile Kotlin
          settingsTarget: macOSDemo
          script: |
            cd "$SRCROOT/../../.."
            export ARCHS=arm64
            if [ -n "${GRADLE_JVM_ARGS:-}" ]; then
              ./gradlew -p flareUI "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" :demo:shared:embedAndSignAppleFrameworkForXcode
            else
              ./gradlew -p flareUI :demo:shared:embedAndSignAppleFrameworkForXcode
            fi
      targets:
        macOSDemo: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
