name: FlareUIDemo

options:
  minimumXcodeGenVersion: 2.45.4
  developmentLanguage: en
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_VERSION: "6.0"

projectReferences:
  FlareUIApple:
    path: ../../apple/FlareUIApple.xcodeproj

targetTemplates:
  FlareUIDemoApp:
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../apple-framework/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -framework FlareUIDemoKit"

targets:
  iOSDemo:
    templates: [FlareUIDemoApp]
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
    dependencies:
      - target: FlareUIApple/FlareUISwiftUI_iOS
        embed: false
      - target: FlareUIApple/FlareUIUIKit
        embed: false
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Flare UI Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.flareui.demo.ios
        PRODUCT_NAME: Flare UI Demo
        TARGETED_DEVICE_FAMILY: "1,2"

  macOSDemo:
    templates: [FlareUIDemoApp]
    type: application
    platform: macOS
    sources:
      - path: Sources/macOS
    dependencies:
      - target: FlareUIApple/FlareUISwiftUI_macOS
        embed: false
      - target: FlareUIApple/FlareUIAppKit
        embed: false
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Flare UI Demo
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimension.flare.flareui.demo.macos
        PRODUCT_NAME: Flare UI Demo

schemes:
  FlareUIDemo-iOS:
    build:
      targets:
        iOSDemo: all
      preActions:
        - name: Generate Flare UI code and compile Kotlin framework
          settingsTarget: iOSDemo
          script: &flareUiDemoBuildScript |
            cd "$SRCROOT/../../.."
            export ARCHS=arm64
            if [ -n "${GRADLE_JVM_ARGS:-}" ]; then
              ./gradlew "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" :flareUI:demo:apple-framework:embedAndSignAppleFrameworkForXcode
            else
              ./gradlew :flareUI:demo:apple-framework:embedAndSignAppleFrameworkForXcode
            fi
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FlareUIDemo-macOS:
    build:
      targets:
        macOSDemo: all
      preActions:
        - name: Generate Flare UI code and compile Kotlin framework
          settingsTarget: macOSDemo
          script: *flareUiDemoBuildScript
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
