[workspace]
members = ["crates/flare-core", "crates/flare-ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
crux_core = "=0.20.0"
facet = "=0.46.5"
serde = { version = "1", features = ["derive"] }
boltffi = { version = "=0.29.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
