[package]
name = "flare-datastore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
buffa = { version = "=0.9.2", default-features = false, features = ["std"] }
futures-core = "0.3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocking = "1.6"
tempfile = "3.27"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSPathUtilities", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError", "NSFileManager", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
dirs = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
idb = { version = "0.6.5", default-features = false, features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BroadcastChannel", "Document", "Event", "EventTarget", "MessageEvent", "Window"] }

[dev-dependencies]
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
buffa-build = "=0.9.2"
prost-types = "0.14"
protox = "0.10"

[lints]
workspace = true
