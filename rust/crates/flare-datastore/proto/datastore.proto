message BooleanTextArgument {
  required bool value = 1;
  optional string text = 2;
}

message NumberTextArgument {
  required double value = 1;
  optional string text = 2;
}

message StringTextArgument {
  required string value = 1;
  optional string text = 2;
}

// Kotlin sealed values store the serialization name and an embedded Protobuf message.
message KotlinVariant {
  required string serial_name = 1;
  required bytes payload = 2;
}

message HomeTimelinePositionEntry {
  required string key = 1;
  required HomeTimelinePosition value = 2;
}

message AccountProxyPolicyEntry {
  required string key = 1;
  required ProxyPolicy value = 2;
}

message TextArgumentEntry {
  required string key = 1;
  required KotlinVariant value = 2;
}
