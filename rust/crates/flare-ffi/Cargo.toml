[package]
name = "flare-ffi"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flare-core = { path = "../flare-core", features = ["native-ffi"] }
boltffi.workspace = true

# BoltFFI generates the unsafe ABI boundary; handwritten implementation is safe Rust.
[lints.clippy]
all = "warn"
pedantic = "warn"
